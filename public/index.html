<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Zenvoki Recarga</title>

  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <main class="container">

    <header class="logo">
      <h1>Zenvoki <span>Recarga</span></h1>
      <p>Sua recarga, em poucos minutos.</p>
    </header>

    <section class="hero">

      <h2>Faça sua recarga<br>de forma simples.</h2>

      <p>
        Escolha sua operadora, informe o número
        e faça seu pedido com segurança.
      </p>

      <button
        type="button"
        class="btn-recarregar"
        onclick="abrirRecarga()"
      >
        📱 Fazer Recarga
      </button>

      <div class="beneficios">

        <div class="beneficio">
          <div class="icone">⚡</div>
          <span>Processo rápido</span>
        </div>

        <div class="beneficio">
          <div class="icone">🔒</div>
          <span>Pagamento seguro</span>
        </div>

        <div class="beneficio">
          <div class="icone">✓</div>
          <span>Atendimento</span>
        </div>

      </div>

    </section>

    <footer class="footer">
      Zenvoki Recarga © 2026
    </footer>

  </main>

  <script>
    function abrirRecarga() {
      window.location.href = "/recarga.html";
    }
  </script>

</body>
</html>

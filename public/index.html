<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>B - RECARGA</title>

  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <main class="container">

    <header class="logo">
      <h1>B <span>- RECARGA</span></h1>
      <p>Sua recarga, em poucos minutos.</p>
    </header>

    <section class="hero">

      <h2>Acesse sua conta<br>para continuar.</h2>

      <p>
        Entre na sua conta ou crie uma nova
        para fazer suas recargas.
      </p>

      <button
        type="button"
        class="btn-recarregar"
        onclick="abrirLogin()"
      >
        👤 Entrar
      </button>

      <button
        type="button"
        class="btn-recarregar"
        onclick="abrirCadastro()"
        style="
          margin-top: 12px;
          background: rgba(255,255,255,0.06);
          box-shadow: none;
        "
      >
        📝 Criar conta
      </button>

      <div class="beneficios">

        <div class="beneficio">
          <div class="icone">🔒</div>
          <span>Conta segura</span>
        </div>

        <div class="beneficio">
          <div class="icone">⚡</div>
          <span>Processo rápido</span>
        </div>

        <div class="beneficio">
          <div class="icone">✓</div>
          <span>Atendimento</span>
        </div>

      </div>

    </section>

    <footer class="footer">
      B - RECARGA © 2026
    </footer>

  </main>

  <script>

    function abrirLogin() {
      window.location.href = "/login.html";
    }

    function abrirCadastro() {
      window.location.href = "/cadastro.html";
    }

  </script>

</body>
</html>

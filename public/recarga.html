<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fazer Recarga - Zenvoki</title>

  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <main class="container">

    <header class="logo">
      <h1>Zenvoki <span>Recarga</span></h1>
      <p>Escolha sua operadora</p>
    </header>

    <section class="hero">

      <h2>Qual é sua operadora?</h2>

      <p>
        Selecione a operadora do número que deseja recarregar.
      </p>

      <button
        type="button"
        class="btn-recarregar"
        onclick="window.location.href='/tim.html'"
      >
        🔵 TIM
      </button>

      <button
        type="button"
        class="btn-recarregar"
        onclick="window.location.href='/claro.html'"
        style="margin-top: 12px;"
      >
        🔴 CLARO
      </button>

      <button
        type="button"
        class="btn-recarregar"
        onclick="window.location.href='/painel.html'"
        style="margin-top: 12px; background: rgba(255,255,255,0.06); box-shadow: none;"
      >
        ← Voltar
      </button>

    </section>

  </main>

</body>
</html>

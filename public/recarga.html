<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Fazer Recarga - Zenvoki Recarga</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >
</head>

<body>

  <main class="container">

    <header class="logo">
      <h1>
        Zenvoki <span>Recarga</span>
      </h1>

      <p>
        Escolha sua operadora
      </p>

    </header>

    <section class="hero">

      <h2>
        Qual é sua operadora?
      </h2>

      <p>
        Selecione a operadora do número que deseja recarregar.
      </p>

      <button
  id="btnTIM"
  type="button"
  class="btn-recarregar"
  onclick="window.location.href='/tim.html'"
>
  🔵 TIM
</button>

<button
  id="btnCLARO"
  type="button"
  class="btn-recarregar"
  onclick="window.location.href='/claro.html'"
  style="margin-top: 12px;"
>
  🔴 CLARO
</button>
<button
  id="btnVIVO"
  type="button"
  class="btn-recarregar"
  onclick="window.location.href='/vivo.html'"
  style="margin-top: 12px;"
>
  &#x1F7E3; VIVO
</button>

<button
        type="button"
        class="btn-recarregar"
        onclick="window.location.href='/painel.html'"
        style="
          margin-top: 12px;
          background: rgba(255,255,255,0.06);
          box-shadow: none;
        "
      >
        ← Voltar
      </button>

    </section>

  </main>

  <script>

    async function carregarStatusOperadoras() {

      try {

        const resposta =
          await fetch("/api/operadoras");

        const dados =
          await resposta.json();

        if (!resposta.ok) {
          throw new Error(
            dados.error ||
            "Erro ao carregar status."
          );
        }

        const operadoras =
          dados.operadoras || {};

        const btnTIM =
          document.getElementById("btnTIM");

        const btnCLARO =
          document.getElementById("btnCLARO");
const btnVIVO =
  document.getElementById("btnVIVO");

        if (operadoras.TIM !== true) {

          btnTIM.style.display = "none";

        }


        if (operadoras.CLARO !== true) {

          btnCLARO.style.display = "none";

        }
if (operadoras.VIVO !== true) {
  btnVIVO.style.display = "none";
}


                 if (
                operadoras.TIM !== true &&
                operadoras.CLARO !== true &&
                operadoras.VIVO !== true
                 ) {

          const mensagem =
            document.createElement("p");

          mensagem.textContent =
            "Nenhuma operadora disponível no momento.";

          mensagem.style.marginTop = "20px";

          document
            .querySelector(".hero")
            .insertBefore(
              mensagem,
              document.querySelector(
                'button[onclick*="painel.html"]'
              )
            );

        }

      } catch (erro) {

        console.error(
          "Erro ao carregar status das operadoras:",
          erro
        );

      }

    }


    carregarStatusOperadoras();

  </script>

</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin - Zenvoki Recarga</title>

  <link rel="stylesheet" href="/admin/style.css">
</head>

<body>

  <main class="login-container">

    <div class="login-card">

      <div class="logo">
        <div class="logo-icon">ZV</div>

        <h1>Zenvoki <span>Recarga</span></h1>

        <p>Painel Administrativo</p>
      </div>

      <form id="loginForm">

        <label for="usuario">
          Usuário
        </label>

        <input
          id="usuario"
          type="text"
          placeholder="Digite seu usuário"
          autocomplete="username"
          required
        >

        <label for="senha">
          Senha
        </label>

        <input
          id="senha"
          type="password"
          placeholder="Digite sua senha"
          autocomplete="current-password"
          required
        >

        <button type="submit">
          🔐 Entrar no painel
        </button>

        <p id="mensagem"></p>

      </form>

      <div class="footer">
        Zenvoki Recarga © 2026
      </div>

    </div>

  </main>

  <script src="/admin/script.js"></script>

</body>
</html>

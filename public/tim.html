<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TIM - Zenvoki Recarga</title>
  <link rel="stylesheet" href="/style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(0,110,255,.16), transparent 38%),
        #050b16;
      color: #fff;
    }

    .tim-page {
      width: 100%;
      min-height: 100vh;
      padding: 18px 14px 30px;
    }

    .tim-top {
      text-align: center;
      margin-bottom: 16px;
    }

    .tim-top h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
    }

    .tim-top h1 span {
      color: #1683ff;
    }

    .tim-top p {
      margin: 5px 0 0;
      color: #91a5bd;
      font-size: 13px;
    }

    .tim-card {
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      padding: 18px;
      border-radius: 22px;

      background:
        linear-gradient(
          145deg,
          rgba(8,35,70,.98),
          rgba(4,13,28,.99)
        );

      border: 1px solid rgba(30,136,229,.38);

      box-shadow:
        0 20px 60px rgba(0,0,0,.55),
        0 0 35px rgba(0,119,255,.13);
    }

    .tim-brand {
      text-align: center;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255,255,255,.07);
    }

    .tim-header-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    .tim-header-row h2 {
      margin: 0;
      font-size: 21px;
    }

    .tim-header-row .tim-logo {
      width: 42px;
      height: 42px;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tim-img {
      width: 34px !important;
      height: 34px !important;
      max-width: 34px !important;
      max-height: 34px !important;
      object-fit: contain !important;
      border-radius: 50%;
      display: block;
    }

    .tim-logo {
      width: 42px;
      height: 42px;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tim-brand h2 {
      margin: 0;
      font-size: 21px;
    }

    .tim-brand p {
      margin: 5px 0 0;
      color: #91a5bd;
      font-size: 13px;
    }

    .section-title {
      margin: 18px 0 10px;
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .6px;
    }

    .field-label {
      display: block;
      margin-bottom: 7px;
      color: #9fb4cc;
      font-size: 12px;
      font-weight: 600;
    }

    .phone-input {
      width: 100%;
      height: 50px;
      padding: 0 14px;

      border-radius: 13px;
      border: 1px solid rgba(70,160,255,.28);

      outline: none;

      background: rgba(0,0,0,.22);
      color: #fff;

      font-size: 16px;
      font-weight: 600;
    }

    .phone-input:focus {
      border-color: #1683ff;
      box-shadow: 0 0 0 3px rgba(22,131,255,.10);
    }

    .valor-label {
      margin-top: 18px;
    }

    #listaRecargas {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .valor-btn {
      min-height: 54px;
      border-radius: 14px;
      border: 1px solid rgba(70,160,255,.35);

      background:
        linear-gradient(
          135deg,
          #1683ff,
          #005eff
        );

      color: #fff;
      font-size: 14px;
      font-weight: 800;

      cursor: pointer;

      box-shadow:
        0 7px 20px rgba(0,102,255,.20);
    }

    .valor-btn.selected {
      border-color: #fff;
      box-shadow:
        0 0 0 2px rgba(22,131,255,.45),
        0 8px 25px rgba(0,102,255,.35);
      transform: translateY(-1px);
    }

    .tipo-recarga-title {
      margin: 12px 0 2px !important;
      padding: 0 !important;
      line-height: 18px !important;
    }

    .tipo-recarga-title + .modo-box {
      margin: 0 auto !important;
    }

    .modo-box {
      width: 100%;
      min-height: 38px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 0 14px;
      margin: 0;

      border-radius: 11px;
      border: 1px solid rgba(30,136,229,.28);
      background: rgba(255,255,255,.045);

      color: #dcecff;
      font-size: 13px;
      font-weight: 700;
    }

    .modo-option {
      color: #dcecff;
      font-size: 13px;
      font-weight: 700;
    }

    .prazo-box {
      padding: 13px 14px;
      border-radius: 13px;

      background: rgba(255,255,255,.045);
      border: 1px solid rgba(255,255,255,.08);

      color: #c8d5e4;
      font-size: 13px;
      line-height: 1.45;
    }

    .prazo-box strong {
      color: #fff;
    }

    .confirmar {
      width: 100%;
      min-height: 54px;
      margin-top: 18px;

      border: 0;
      border-radius: 14px;

      background:
        linear-gradient(
          135deg,
          #1683ff,
          #0061df
        );

      color: #fff;
      font-size: 15px;
      font-weight: 800;

      box-shadow:
        0 10px 28px rgba(0,102,255,.28);
    }

    .confirmar:active {
      transform: scale(.98);
    }

    .voltar {
      width: 100%;
      min-height: 45px;
      margin-top: 10px;

      border-radius: 13px;
      border: 1px solid rgba(255,255,255,.10);

      background: rgba(255,255,255,.045);
      color: #cbd9e8;

      font-size: 14px;
      font-weight: 600;
    }

    .mensagem {
      margin-top: 10px;
      text-align: center;
      color: #ff8c8c;
      font-size: 12px;
      min-height: 16px;
    }

    .carregando {
      grid-column: 1 / -1;
      text-align: center;
      padding: 12px;
      color: #91a5bd;
      font-size: 13px;
    }

    @media (max-width: 360px) {
      .tim-page {
        padding: 12px 10px 24px;
      }

      .tim-card {
        padding: 14px;
      }

      .tim-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
    }

    .tim-logo {
        width: 60px;
        height: 60px;
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

<main class="tim-page">

  <header class="tim-top">
    <h1>Zenvoki <span>Recarga</span></h1>
    <p>Recarga TIM</p>
  </header>

  <section class="tim-card">

    <div class="tim-brand">
      <div class="tim-header-row">
        <div class="tim-logo">
          <img src="/assets/tim.jpg" alt="TIM" class="tim-img">
        </div>
        <h2>Recarga TIM</h2>
      </div>
      <p>Preencha os dados da sua recarga</p>
    </div>

    <div class="section-title">
      Dados da Recarga
    </div>

    <label class="field-label" for="numero">
      Número do celular
    </label>

    <input
      id="numero"
      class="phone-input"
      type="tel"
      inputmode="numeric"
      maxlength="15"
      placeholder="(00) 00000-0000"
      autocomplete="tel"
    >

    <div class="section-title valor-label">
      VALOR DA RECARGA
    </div>

    <div id="listaRecargas">
      <div class="carregando">
        Carregando valores...
      </div>
    </div>

    <div class="section-title tipo-recarga-title">
      TIPO DE RECARGA
    </div>

    <div id="modoBox" class="modo-box">
      Carregando...
    </div>

    <div class="section-title">
      Prazo de Processamento
    </div>

    <div class="prazo-box">
      Após a confirmação do pagamento,
      <strong>a recarga será processada dentro do prazo informado pelo sistema.</strong>
    </div>

    <div id="mensagem" class="mensagem"></div>

    <button
      id="confirmar"
      class="confirmar"
      type="button"
    >
      ⚡ Confirmar Recarga
    </button>

    <button
      class="voltar"
      type="button"
      onclick="window.location.href='/recarga.html'"
    >
      ← Voltar
    </button>

  </section>

</main>

<script>
  let valorSelecionado = null;
  let modoRecarga = "sem_codigo";

  const numeroInput =
    document.getElementById("numero");

  const lista =
    document.getElementById("listaRecargas");

  const mensagem =
    document.getElementById("mensagem");

  function formatarTelefone(valor) {
    let numero = valor.replace(/\D/g, "").slice(0, 11);

    if (numero.length <= 2) {
      return numero;
    }

    if (numero.length <= 7) {
      return "(" + numero.slice(0, 2) + ") " +
        numero.slice(2);
    }

    return "(" + numero.slice(0, 2) + ") " +
      numero.slice(2, 7) + "-" +
      numero.slice(7);
  }

  numeroInput.addEventListener("input", () => {
    numeroInput.value =
      formatarTelefone(numeroInput.value);
  });

  function selecionarValor(recarga, preco, botao) {
    valorSelecionado = {
      recarga,
      preco
    };

    document
      .querySelectorAll(".valor-btn")
      .forEach(btn =>
        btn.classList.remove("selected")
      );

    botao.classList.add("selected");

    mensagem.textContent = "";
  }

  function atualizarModoVisual() {
    const box = document.getElementById("modoBox");

    if (modoRecarga === "com_codigo") {
      box.innerHTML = `
        <div class="modo-option">
          ❌ Com código
        </div>
      `;
    } else {
      box.innerHTML = `
        <div class="modo-option">
          ✅ Sem código
        </div>
      `;
    }
  }

  async function carregarModo() {
    try {
      const resposta =
        await fetch("/api/recharge-mode/TIM");

      const dados =
        await resposta.json();

      if (resposta.ok && dados.modoRecarga) {
        modoRecarga = dados.modoRecarga;
      }

    } catch (erro) {
      console.error(
        "Erro ao carregar modo:",
        erro
      );
    }

    atualizarModoVisual();
  }

  async function carregarRecargas() {
    try {
      const status =
        await fetch("/api/operadoras");

      const statusDados =
        await status.json();

      if (
        !status.ok ||
        statusDados.operadoras?.TIM === false
      ) {
        lista.innerHTML =
          '<p class="carregando">🔴 Recarga TIM indisponível no momento.</p>';
        return;
      }

      const resposta =
        await fetch("/api/recharges");

      const dados =
        await resposta.json();

      if (!resposta.ok) {
        throw new Error(
          dados.error ||
          "Erro ao carregar recargas."
        );
      }

      const recargas =
        dados.recharges?.TIM || {};

      lista.innerHTML = "";

      for (const recarga of Object.keys(recargas)) {

        const configuracao =
          recargas[recarga];

        if (
          typeof configuracao === "object" &&
          configuracao.ativo === false
        ) {
          continue;
        }

        const preco =
          typeof configuracao === "object"
            ? configuracao.preco
            : configuracao;

        const botao =
          document.createElement("button");

        botao.type = "button";
        botao.className = "valor-btn";

        botao.textContent =
          `R$ ${recarga} → R$ ${Number(preco)
            .toFixed(2)
            .replace(".", ",")}`;

        botao.onclick = () =>
          selecionarValor(
            recarga,
            preco,
            botao
          );

        lista.appendChild(botao);
      }

      if (!lista.children.length) {
        lista.innerHTML =
          '<p class="carregando">Nenhuma recarga disponível no momento.</p>';
      }

    } catch (erro) {
      console.error(
        "Erro ao carregar recargas:",
        erro
      );

      lista.innerHTML =
        '<p class="carregando">Não foi possível carregar as recargas.</p>';
    }
  }

  document
    .getElementById("confirmar")
    .addEventListener("click", () => {

      const numero =
        numeroInput.value.replace(/\D/g, "");

      if (numero.length !== 11) {
        mensagem.textContent =
          "Digite um número de celular válido.";
        numeroInput.focus();
        return;
      }

      if (!valorSelecionado) {
        mensagem.textContent =
          "Escolha o valor da recarga.";
        return;
      }

      const params =
        new URLSearchParams({
          operadora: "TIM",
          numero,
          recarga: valorSelecionado.recarga,
          preco: valorSelecionado.preco,
          modo: modoRecarga
        });

      window.location.href =
        "/confirmar.html?" + params.toString();
    });

  carregarModo();
  carregarRecargas();
</script>

</body>
</html>

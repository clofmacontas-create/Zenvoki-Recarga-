<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <title>Zenvoki Recarga</title>

  <link rel="stylesheet" href="/style.css">
</head>

  <main class="container">

    <header class="logo">
      <h1>Zenvoki <span>Recarga</span></h1>

    <section class="hero">

      <h2>Faça sua recarga<br>de forma simples.</h2>

      <p>

      </p>

      <button
        type="button"
        class="btn-recarregar"
        onclick="window.location.href='/recarga.html'"
      >
        📱 Fazer Recarga
      </button>

      <div class="beneficios">

        <div class="beneficio">
          <div class="beneficio-icon">⚡</div>
          <p>Processo rápido</p>
        </div>

        <div class="beneficio">
          <div class="beneficio-icon">🔒</div>
          <p>Pagamento seguro</p>
        </div>

        <div class="beneficio">
          <div class="beneficio-icon">✓</div>
          <p>atendimento</p>
        </div>

      </div>

    </section>

    <footer class="footer">
      Zenvoki Recarga © 2026
    </footer>

  </main>

</html>
